components:
  schemas:
    User:
      $ref: "./entities/User.schema.json"
    Transaction:
      $ref: "./entities/Transaction.schema.json"
    TxStatus:
      $ref: "./entities/TxStatus.schema.json"
    NotificationItem:
      $ref: "./entities/NotificationItem.schema.json"
    AuditLogEntry:
      $ref: "./entities/AuditLogEntry.schema.json"
    DemoConfig:
      $ref: "./entities/DemoConfig.schema.json"
    ErrorEnvelope:
      $ref: "./entities/ErrorEnvelope.schema.json"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    TransactionId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Transaction:
      description: Transaction
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Transaction"
    UserToken:
      description: User plus bearer token
      content:
        application/json:
          schema:
            type: object
            required: [user, token]
            properties:
              user:
                $ref: "#/components/schemas/User"
              token:
                type: string
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Action forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Invalid state transition
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
