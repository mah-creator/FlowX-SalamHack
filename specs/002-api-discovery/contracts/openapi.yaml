paths:
  /transactions:
    get:
      operationId: EP-001
      summary: List transactions
      security:
        - bearerAuth: []
      x-classification: derived
      x-source-citation: frontend/src/pages/DashboardPage.tsx
      x-phase3-grounding-note: Treat the dashboard transaction list as the de-facto read contract until the frontend wires the actual HTTP call.
      x-frontend-flow: [DashboardPage]
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                type: object
                required: [transactions]
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: EP-003
      summary: Create transaction
      security:
        - bearerAuth: []
      x-classification: derived
      x-source-citation: frontend/src/context/DemoContext.tsx:168-170
      x-phase3-grounding-note: Treat the named DemoContextValue method and reducer action as the de-facto contract until the frontend wires the actual HTTP call.
      x-frontend-operation: createTransaction
      x-frontend-flow: [NewTransferPage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency]
              properties:
                amount:
                  type: number
                currency:
                  type: string
                  enum: [USD, EGP, ILS]
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
